[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whycode"
version = "0.1.0"
description = "AI-powered Git history tool for understanding how code evolved over time"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "whycode contributors" }]
keywords = ["git", "ai", "developer-tools", "code-review", "history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "rich>=13.0",
    "diskcache>=5.6",
    "openai>=1.0",
    "anthropic>=0.25",
    "ollama>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[project.scripts]
whycode = "whycode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whycode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["whycode"]
omit = ["tests/*"]
